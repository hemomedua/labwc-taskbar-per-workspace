name: build-deb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gnupg file

      - uses: actions/checkout@v4

      - name: Setup (Raspberry Pi repo + build dependencies)
        shell: bash -eo pipefail {0}
        run: ./scripts/ci-setup.sh 2>&1 | tee -a build.log

      - name: Build and package
        shell: bash -eo pipefail {0}
        run: ./scripts/build.sh 2>&1 | tee -a build.log

      - name: Publish build log to branch build-logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logbranch && cp build.log /tmp/logbranch/ 2>/dev/null || echo "no log" > /tmp/logbranch/build.log
          cd /tmp/logbranch
          git init -q && git checkout -q -b build-logs
          git config user.name ci && git config user.email ci@example.com
          git add . && git commit -qm "build log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-logs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: labwc-deb
          path: out/*.deb

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: labwc 0.9.8 + taskbar per workspace (build ${{ github.run_number }})
          files: out/*.deb
